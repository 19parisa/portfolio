<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #1a1a1a;
    --white: #ffffff;
    --gray-100: #f5f5f5;
    --gray-200: #e8e8e8;
    --gray-400: #999;
    --gray-600: #555;
  }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--white);
    color: var(--black);
    -webkit-font-smoothing: antialiased;
  }
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2rem;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--gray-200);
  }
  .nav-back {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'Inter Tight', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--gray-400);
    text-decoration: none;
    transition: color 0.2s;
  }
  .nav-back:hover { color: var(--black); }
  .nav-back svg { width: 14px; height: 14px; }
  .nav-title {
    font-family: 'Inter Tight', sans-serif;
    font-size: 0.88rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--black);
  }
  .nav-tags { display: flex; gap: 0.4rem; }
  .nav-tag {
    font-size: 0.68rem;
    font-weight: 500;
    padding: 0.2rem 0.65rem;
    border-radius: 999px;
    border: 1px solid var(--gray-200);
    color: var(--gray-600);
  }
  .page-hero {
    max-width: 1200px;
    margin: 0 auto;
    padding: 4rem 2rem 3rem;
    border-bottom: 1px solid #f0f0f0;
  }
  .page-title {
    font-family: 'Inter Tight', sans-serif;
    font-size: clamp(2.2rem, 5vw, 4rem);

    letter-spacing: -0.04em;

  }

    font-size: 0.9rem;
    color: var(--gray-600);
    line-height: 1.7;
    max-width: 520px;
  }
  .gallery-section {
    max-width: 1200px;
    margin: 0 auto;
    padding: 3.5rem 2rem 6rem;
  }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.25rem;
  }
  .gallery-card { display: flex; flex-direction: column; gap: 0.6rem; }
  .gallery-item {
    border-radius: 0;
    overflow: hidden;
    background: var(--gray-100);
    aspect-ratio: 1 / 1;
    position: relative;
    cursor: pointer;
  }
  .gallery-item:hover img { filter: brightness(0.92); }
  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: filter 0.3s ease;
  }
  .gallery-skeleton {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    z-index: 1;
    transition: opacity 0.3s;
  }
  .gallery-skeleton.hidden { opacity: 0; pointer-events: none; }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  
  /* Added text container wrapper to handle individual element layout rules */
  .gallery-card-info {
    display: flex;
    flex-direction: column;
    gap: 0.2rem; /* Uniform spacing between Heading and Sub caption */
    margin-top: 0.2rem; /* Uniform spacing between Grid Item Image and the text blocks */
  }
  
  .gallery-caption-title {
    font-family: 'Inter Tight', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--black);
  }
  .gallery-caption-sub {
    font-size: 0.75rem;
    color: var(--gray-400);
  }
  @media (max-width: 768px) {
    .gallery-grid { grid-template-columns: 1fr 1fr; }
    .page-hero { padding: 2.5rem 1.25rem 2rem; }
    .gallery-section { padding: 2.5rem 1.25rem 4rem; }
    nav { padding: 0 1.25rem; }
    .nav-tags { display: none; }
  }
  @media (max-width: 480px) {
    .gallery-grid { grid-template-columns: 1fr; }
  }
</style>
